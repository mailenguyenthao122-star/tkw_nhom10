<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="Dang_nhap.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Đăng Ký</h2>
            <form>
                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" placeholder="Nhập họ và tên của bạn" required>
                </div>
                <div class="input-group">
                    <label>Email / Số điện thoại</label>
                    <input type="text" placeholder="Nhập email hoặc SĐT" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="input-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="auth-button">Đăng Ký Ngay</button>
            </form>
        </div>
    </div>
</body>
</html>
