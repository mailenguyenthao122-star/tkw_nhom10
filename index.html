<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <Title>Trang chủ</Title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div> 

<section class="Trang_chu">
    <div class="Trang_chu-container">
        <div class="Trang_chu-left">
            <h1>Đặt sân chơi pickleball dễ dàng</h1>
            <p>Hàng trăm sân chất lượng tại Hà Nội.<br> Đặt online, thanh toán nhanh, nhận xác nhận ngay lập tức.</p>
            
            <div class="group-btn">
                <a href="#" class="btn-primary">Tìm sân ngay</a>
                <a href="#" class="btn-outline">Đặt sân nhanh</a>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <h3>240+</h3>
                    <p>Sân pickleball</p>
                </div>
                <div class="stat-item">
                    <h3>18k</h3>
                    <p>Người chơi</p>
                </div>
                <div class="stat-item">
                    <h3>4.9★</h3>
                    <p>Đánh giá TB</p>
                </div>
            </div>
        </div>

        <div class="Trang_chu-center">
            <img src="https://i.pinimg.com/1200x/11/71/46/1171461c2a37cced0a2bf14515f64a91.jpg" alt="Sân Pickleball">
        </div>

        <div class="Trang_chu-right">
            <div class="poster-card">
                <img src="https://cdn.shopvnb.com/uploads/images/bai_viet/poster-pickleball-9-1776645285.webp" alt="Ưu đãi sân">
                <div class="poster-info">
                    <h4>ƯU ĐÃI SÂN TRONG NHÀ</h4>
                    <button>Ưu đãi ngay</button>
                </div>
            </div>
            <div class="poster-card">
                <img src="https://vntaacademy.com/wp-content/uploads/2024/08/Hoc-Pickleball-o-Dau-Tai-Ha-Noi-Top-10-Dia-Chi-Hoc-Pickleball-Ha-Noi-Chat-Luong-Cao-Gia-Tot-Hoc-Vien-VNTA-Academy-20.jpg" alt="Khóa học">
                <div class="poster-info">
                    <h4>HỌC PICKLEBALL NGAY</h4>
                    <button>Xem khóa học</button>
                </div>
            </div>
            <div class="poster-card">
                <img src="https://bizweb.dktcdn.net/100/493/915/products/vot-pickleball-ama-sport-nova-pro-1.jpg?v=1767836991320" alt="Mua vợt">
                <div class="poster-info">
                    <h4>MUA VỢT TẶNG QUÀ</h4>
                    <button>Mua ngay</button>
                </div>
            </div>
        </div>
    </div>
</section>
<div id="footer-placeholder"></div>
<script>
    fetch('header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;

            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            const navLinks = document.querySelectorAll('.header a');

            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
    fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.error("Không tìm thấy file footer.html"));
            });
        });
</script>
</body>
</html>
